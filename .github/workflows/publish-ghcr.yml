name: Publish GHCR image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, test, and publish image
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-java v6.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Configure GitHub Maven dependency repositories
        shell: bash
        run: |
          set -euo pipefail
          settings_path="${RUNNER_TEMP}/g2rain-maven-settings.xml"
          python3 - "$settings_path" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.Element('settings', xmlns='http://maven.apache.org/SETTINGS/1.0.0')
          servers = ET.SubElement(root, 'servers')
          profile = ET.SubElement(ET.SubElement(root, 'profiles'), 'profile')
          ET.SubElement(profile, 'id').text = 'g2rain-packages'
          repositories = ET.SubElement(profile, 'repositories')
          for name in ('g2rain-infra', 'g2rain-basis'):
              server = ET.SubElement(servers, 'server')
              ET.SubElement(server, 'id').text = name
              ET.SubElement(server, 'username').text = '${env.GITHUB_ACTOR}'
              ET.SubElement(server, 'password').text = '${env.GITHUB_TOKEN}'
              repository = ET.SubElement(repositories, 'repository')
              ET.SubElement(repository, 'id').text = name
              ET.SubElement(repository, 'url').text = 'https://maven.pkg.github.com/g2rain/' + name
              ET.SubElement(ET.SubElement(repository, 'releases'), 'enabled').text = 'true'
              ET.SubElement(ET.SubElement(repository, 'snapshots'), 'enabled').text = 'false'
          ET.SubElement(ET.SubElement(root, 'activeProfiles'), 'activeProfile').text = 'g2rain-packages'
          ET.ElementTree(root).write(sys.argv[1], encoding='utf-8', xml_declaration=True)
          PY
          chmod 600 "$settings_path"
          echo "MAVEN_SETTINGS=$settings_path" >> "$GITHUB_ENV"
          echo 'Configured authenticated Maven repositories: g2rain-infra, g2rain-basis.'

      - name: Validate release tag, branch, note, and project version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Ref '${TAG_NAME}' is not a stable vMAJOR.MINOR.PATCH tag."
            exit 1
          fi

          RELEASE_SHA="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/main; then
            echo "::error::${TAG_NAME} (${RELEASE_SHA}) is not contained in origin/main."
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          RELEASE_NOTE="docs/releases/v${VERSION}.md"
          if ! git cat-file -e "${RELEASE_SHA}:${RELEASE_NOTE}"; then
            echo "::error::${RELEASE_NOTE} is missing from the tagged commit."
            exit 1
          fi
          if ! git show "${RELEASE_SHA}:${RELEASE_NOTE}" | grep -q '[^[:space:]]'; then
            echo "::error::${RELEASE_NOTE} is empty in the tagged commit."
            exit 1
          fi

          PROJECT_VERSION="$(mvn --settings "$MAVEN_SETTINGS" --batch-mode --quiet -Dstyle.color=never -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "${PROJECT_VERSION}" != "${VERSION}" ]]; then
            echo "::error::Tag ${TAG_NAME} does not match Maven project.version ${PROJECT_VERSION}."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and test
        run: mvn --settings "$MAVEN_SETTINGS" --batch-mode --no-transfer-progress -U clean verify

      - name: Log in to GitHub Container Registry
        shell: bash
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the release image once
        id: image
        shell: bash
        env:
          IMAGE: ghcr.io/g2rain/g2rain-gateway-webmvc
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg JAR_FILE="target/g2rain-gateway-webmvc-${VERSION}.jar" \
            --build-arg BUILD_VERSION="${VERSION}" \
            --build-arg VCS_REF="${RELEASE_SHA}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:sha-${RELEASE_SHA}" \
            .

      - name: Push both immutable release tags
        shell: bash
        env:
          IMAGE: ghcr.io/g2rain/g2rain-gateway-webmvc
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:sha-${RELEASE_SHA}"
          {
            echo '## GHCR publication succeeded'
            echo
            echo "- Image: \`${IMAGE}:${VERSION}\`"
            echo "- Immutable commit tag: \`${IMAGE}:sha-${RELEASE_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
